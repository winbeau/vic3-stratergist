[project]
name = "vic3-mcp"
version = "0.1.0"
description = "MCP server that reads Victoria 3 saves and answers campaign questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.0,<2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
vic3-mcp = "vic3_mcp.server:main"
vic3-web = "vic3_mcp.webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vic3_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/vic3_mcp" = "vic3_mcp"

[tool.uv]
package = true
